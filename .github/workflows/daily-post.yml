name: Daily Social Content

on:
  workflow_dispatch:
  schedule:
    # 06:15 IST = 00:45 UTC
    - cron: "45 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    name: Generate infographic + Reel
    runs-on: ubuntu-latest

    env:
      DRY_RUN: "true"
      POST_LIMIT: ${{ vars.POST_LIMIT || '1' }}
      TOPICS_FILE: topics/topics.docx
      STATE_FILE: state.json
      OUTPUT_DIR: generated

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate infographic and Reel
        run: python -m src.main

      - name: Commit generated Reel assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ state.json
          git diff --cached --quiet || git commit -m "chore: generate daily Reel content"
          git push

  publish:
    name: Publish Instagram Reels
    needs: generate
    if: ${{ vars.DRY_RUN != 'true' && vars.INSTAGRAM_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    env:
      DRY_RUN: "false"
      POST_LIMIT: ${{ vars.POST_LIMIT || '1' }}
      TOPICS_FILE: topics/topics.docx
      STATE_FILE: state.json
      OUTPUT_DIR: generated

      INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED || 'false' }}
      INSTAGRAM_GRAPH_BASE_URL: ${{ vars.INSTAGRAM_GRAPH_BASE_URL || 'https://graph.instagram.com' }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v25.0' }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ vars.INSTAGRAM_ACCOUNT_ID }}

      PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/generated

    steps:
      - name: Checkout latest generated assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pull latest generated assets
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify public Reel files
        shell: bash
        run: |
          set -e

          found=0

          for file in generated/*.mp4; do
            [ -e "$file" ] || continue
            found=1

            name="$(basename "$file")"
            url="${PUBLIC_BASE_URL}/${name}"

            echo "Checking Reel URL: $url"

            success=0
            for i in {1..20}; do
              if curl -fsIL "$url" >/dev/null 2>&1; then
                success=1
                break
              fi
              sleep 5
            done

            if [ "$success" -ne 1 ]; then
              echo "Reel URL is not publicly reachable: $url"
              exit 1
            fi
          done

          if [ "$found" -ne 1 ]; then
            echo "No MP4 Reel files found in generated/."
            exit 1
          fi

      - name: Publish next Reel
        run: python -m src.main

      - name: Commit Reel publish status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update Reel publish status"
          git push
