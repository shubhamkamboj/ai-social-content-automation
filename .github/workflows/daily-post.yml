name: Daily Social Content

on:
  workflow_dispatch:
  schedule:
    # 06:15 IST = 00:45 UTC
    - cron: "45 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    name: Generate content
    runs-on: ubuntu-latest

    env:
      DRY_RUN: "true"
      POST_LIMIT: ${{ vars.POST_LIMIT || '1' }}
      TOPICS_FILE: topics/topics.docx
      STATE_FILE: state.json
      OUTPUT_DIR: generated

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate images and captions
        run: python -m src.main

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ state.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: generate daily social content"
            git push
          fi

  publish:
    name: Publish content
    needs: generate
    if: ${{ vars.DRY_RUN != 'true' && vars.INSTAGRAM_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    env:
      DRY_RUN: "false"
      POST_LIMIT: ${{ vars.POST_LIMIT || '1' }}
      TOPICS_FILE: topics/topics.docx
      STATE_FILE: state.json
      OUTPUT_DIR: generated

      INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED || 'false' }}
      INSTAGRAM_GRAPH_BASE_URL: ${{ vars.INSTAGRAM_GRAPH_BASE_URL || 'https://graph.instagram.com' }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ vars.INSTAGRAM_ACCOUNT_ID }}

      # Images committed in this job become reachable from this raw URL.
      PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/generated

      # Keep version configurable. Current default can be changed without code edits.
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v25.0' }}

    steps:
      - name: Checkout latest generated content
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pull latest state and images
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for raw GitHub images
        shell: bash
        run: |
          set -e
          LIMIT="${POST_LIMIT:-1}"
          for file in generated/*.png; do
            [ -e "$file" ] || continue
            NAME="$(basename "$file")"
            URL="${PUBLIC_BASE_URL}/${NAME}"
            echo "Checking $URL"
            for i in {1..12}; do
              if curl -fsIL "$URL" >/dev/null 2>&1; then
                echo "Available: $URL"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "Image not publicly reachable: $URL"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Publish next topics
        run: python -m src.main

      - name: Fail job when a topic failed
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(Path("state.json").read_text(encoding="utf-8"))
          limit = int(__import__("os").environ.get("POST_LIMIT", "1"))

          candidates = [
              x for x in data.get("topics", {}).values()
              if x.get("status") in {"PUBLISHED", "FAILED"}
          ]

          failed = [
              x for x in candidates
              if x.get("status") == "FAILED"
              and x.get("updated_at")
          ]

          if failed:
              for item in failed[-limit:]:
                  print(f"FAILED: {item.get('topic')} -> {item.get('error')}")
              raise SystemExit(1)

      - name: Commit publish status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update publish status"
            git push
          fi
