name: Daily Social Content

on:
  workflow_dispatch:
  schedule:
    # 06:15 IST = 00:45 UTC
    - cron: "45 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    name: Generate infographic + Reel
    runs-on: ubuntu-latest

    env:
      DRY_RUN: "true"
      POST_LIMIT: ${{ vars.POST_LIMIT || '4' }}
      TOPICS_FILE: topics/topics.docx
      STATE_FILE: state.json
      OUTPUT_DIR: generated

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate infographic and Reel
        run: python -m src.main

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ state.json
          git diff --cached --quiet || git commit -m "chore: generate daily social content"
          git push

  publish:
    name: Publish Instagram Reels
    needs: generate
    if: ${{ vars.DRY_RUN != 'true' && vars.INSTAGRAM_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    env:
      DRY_RUN: "false"
      POST_LIMIT: ${{ vars.POST_LIMIT || '4' }}
      TOPICS_FILE: topics/topics.docx
      STATE_FILE: state.json
      OUTPUT_DIR: generated

      INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED || 'false' }}
      INSTAGRAM_GRAPH_BASE_URL: ${{ vars.INSTAGRAM_GRAPH_BASE_URL || 'https://graph.instagram.com' }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v25.0' }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ vars.INSTAGRAM_ACCOUNT_ID }}

      PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/generated

    steps:
      - name: Checkout latest generated assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pull latest generated assets
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify public Reel files
        shell: bash
        run: |
          set -e
          found=0

          while IFS= read -r file; do
            found=1
            name="$(basename "$file")"
            url="${PUBLIC_BASE_URL}/${name}"

            echo "Checking Reel URL: $url"

            success=0
            for i in {1..20}; do
              if curl -fsIL "$url" >/dev/null 2>&1; then
                success=1
                break
              fi
              sleep 5
            done

            if [ "$success" -ne 1 ]; then
              echo "Reel URL is not publicly reachable: $url"
              exit 1
            fi
          done < <(find generated -maxdepth 1 -type f -name "*.mp4" | sort)

          if [ "$found" -ne 1 ]; then
            echo "No MP4 Reel files found in generated/."
            exit 1
          fi

      - name: Publish next Reels
        run: python -m src.main

      - name: Commit publish status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update Reel publish status"
          git push

  topic_reminder:
    name: Low topic queue reminder
    needs:
      - generate
      - publish
    if: ${{ always() }}
    runs-on: ubuntu-latest

    env:
      TOPICS_FILE: topics/topics.docx
      STATE_FILE: state.json
      POST_LIMIT: ${{ vars.POST_LIMIT || '4' }}
      TOPICS_REMINDER_DAYS: "2"

    steps:
      - name: Checkout latest state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pull latest state
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Check remaining topics
        shell: python
        run: |
          import json
          import re
          import sys
          from pathlib import Path
          from docx import Document

          topics_file = Path("topics/topics.docx")
          state_file = Path("state.json")

          daily_posts = int(__import__("os").environ.get("POST_LIMIT", "4"))
          reminder_days = int(__import__("os").environ.get("TOPICS_REMINDER_DAYS", "2"))
          threshold = daily_posts * reminder_days

          def normalize(value: str) -> str:
              return " ".join((value or "").strip().split()).casefold()

          # DOCX is the only source of truth.
          doc = Document(topics_file)
          topics = []

          for paragraph in doc.paragraphs:
              text = " ".join(paragraph.text.strip().split())
              if not text:
                  continue

              # Ignore numbered section headings such as:
              # 1. AWS Architecture
              if re.match(r"^\d+\s*[\.\)]\s+", text):
                  continue

              text = re.sub(r"^[•●▪◦‣\-–—]\s*", "", text).strip()
              if text:
                  topics.append(text)

          unique_topics = []
          seen = set()
          for topic in topics:
              key = normalize(topic)
              if key and key not in seen:
                  seen.add(key)
                  unique_topics.append(topic)

          state = json.loads(state_file.read_text(encoding="utf-8-sig"))
          state_topics = state.get("topics", {})

          published = {
              normalize(item.get("topic", ""))
              for item in state_topics.values()
              if item.get("status") == "PUBLISHED"
          }

          remaining = sum(
              1 for topic in unique_topics
              if normalize(topic) not in published
          )

          print(f"Total current topics : {len(unique_topics)}")
          print(f"Published topics      : {len(unique_topics) - remaining}")
          print(f"Remaining topics      : {remaining}")
          print(f"Reminder threshold    : {threshold}")

          if remaining <= threshold:
              print("")
              print("==============================================")
              print("⚠️  TOPIC QUEUE LOW")
              print("==============================================")
              print(f"Only {remaining} topics remain.")
              print(f"At {daily_posts} posts/day, content will run out in")
              print(f"approximately {remaining / daily_posts:.1f} day(s).")
              print("")
              print("Please update topics/topics.docx with new topics.")
              print("GitHub Actions is configured to email you for failed workflows.")
              print("==============================================")

              # Deliberately fail this job so GitHub's failed-workflow
              # notification can alert the repository owner.
              sys.exit(1)

          print("Topic queue is healthy. No reminder required.")
