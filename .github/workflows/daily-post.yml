name: Daily Social Content
on:
  workflow_dispatch:
  schedule:
    - cron: "45 0 * * *" # 06:15 IST
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      POST_LIMIT: "4"
      TOPICS_FILE: topics/topics.docx
      STATE_FILE: state.json
      OUTPUT_DIR: generated
      INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED || 'false' }}
      LINKEDIN_ENABLED: ${{ vars.LINKEDIN_ENABLED || 'false' }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_ID: ${{ secrets.LINKEDIN_AUTHOR_ID }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m src.main
      - name: Commit state and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json generated/
          git diff --cached --quiet || git commit -m "chore: update daily social content state"
          git push
